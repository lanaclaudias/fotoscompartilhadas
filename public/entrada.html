<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#33422a">
  <meta name="robots" content="noindex">
  <title>Entrada · Convite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Parisienne&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estilo.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; background: var(--papel); }
    .caixa { width: min(100%, 420px); padding: 2rem 1.5rem; text-align: center; }
    .selo { width: 96px; height: 96px; margin: 0 auto 1.1rem; border-radius: 50%; display: grid; place-items: center; color: #fff; }
    .selo .ic { width: 52px; height: 52px; stroke-width: 2.2; }
    .liberado .selo { background: #4d7a35; box-shadow: 0 0 0 10px rgba(77, 122, 53, .15); }
    .ja .selo { background: #c08a2b; box-shadow: 0 0 0 10px rgba(192, 138, 43, .15); }
    .erro .selo { background: var(--erro); box-shadow: 0 0 0 10px rgba(179, 66, 58, .15); }
    h1 { margin: 0; font-family: var(--fonte-caps); font-weight: 700; font-size: 1.5rem; letter-spacing: .06em; text-transform: uppercase; }
    .liberado h1 { color: #4d7a35; } .ja h1 { color: #a5741f; } .erro h1 { color: var(--erro); }
    .nomes { margin: .9rem 0 0; font-family: var(--fonte-script); font-size: 2.3rem; line-height: 1.25; color: var(--verde); }
    .det { margin: .5rem 0 0; color: var(--texto-2); font-size: .95rem; }
    .det strong { color: var(--verde); }
    .login { display: grid; gap: .8rem; }
    .login h1 { color: var(--verde); }
    .msg-erro { color: var(--erro); font-size: .88rem; margin: 0; min-height: 1.2em; }
    .dica { margin: 1.4rem 0 0; font-size: .8rem; color: var(--texto-3); }
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M12 7.5v6M12 17v.01"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>
</svg>

<form class="cartao caixa login" id="login" hidden>
  <h1>Entrada</h1>
  <p class="suave" style="margin:0">Para liberar convites, entre com a senha do painel. Só precisa fazer isso uma vez neste celular.</p>
  <input class="campo" type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
  <button class="botao" type="submit">Entrar</button>
  <p class="msg-erro" id="erro-login"></p>
</form>

<div class="cartao caixa" id="resultado" hidden>
  <div class="selo"><svg class="ic"><use id="icone" href="#i-check"/></svg></div>
  <h1 id="titulo"></h1>
  <p class="nomes" id="nomes"></p>
  <p class="det" id="det"></p>
  <p class="dica">Para o próximo convidado, é só ler o QR Code dele com a câmera.</p>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const codigo = (new URLSearchParams(location.search).get('c') || '').trim().toUpperCase();
  const hora = (iso) => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const dia = (iso) => new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });

  function mostrar(tipo, titulo, icone, nomes, det) {
    $('login').hidden = true;
    const r = $('resultado');
    r.className = `cartao caixa ${tipo}`;
    r.hidden = false;
    $('titulo').textContent = titulo;
    $('icone').setAttribute('href', icone);
    $('nomes').textContent = nomes || '';
    $('det').innerHTML = det || '';
    if (navigator.vibrate) navigator.vibrate(tipo === 'liberado' ? 120 : [100, 80, 100, 80, 100]);
  }

  const pessoas = (n) => `${n} pessoa${n > 1 ? 's' : ''}`;

  async function liberar() {
    let r;
    try {
      r = await fetch('/api/entrada', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ codigo }) });
    } catch {
      return mostrar('erro', 'Sem conexão', '#i-x', '', 'Verifique a internet e leia o QR Code de novo.');
    }
    if (r.status === 401) { $('login').hidden = false; $('resultado').hidden = true; $('senha').focus(); return; }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return mostrar('erro', 'Convite inválido', '#i-x', '', d.erro || 'Este QR Code não é de um convite.');
    const c = d.convite;
    if (d.status === 'liberado') {
      mostrar('liberado', 'Entrada liberada', '#i-check', c.nomes, `Convite nº ${c.numero} · <strong>${pessoas(c.pessoas)}</strong>`);
    } else {
      mostrar('ja', 'Já entrou', '#i-alerta', c.nomes, `Este convite já foi usado às <strong>${hora(c.entradaEm)}</strong> (${dia(c.entradaEm)}).<br>Convite nº ${c.numero} · ${pessoas(c.pessoas)}`);
    }
  }

  $('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('erro-login').textContent = '';
    const r = await fetch('/api/painel/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ senha: $('senha').value }) });
    if (!r.ok) { $('erro-login').textContent = (await r.json().catch(() => ({}))).erro || 'Senha incorreta'; return; }
    liberar();
  });

  if (!/^[A-Z2-9]{8}$/.test(codigo)) mostrar('erro', 'Convite inválido', '#i-x', '', 'Este QR Code não é de um convite.');
  else liberar();
})();
</script>
</body>
</html>
